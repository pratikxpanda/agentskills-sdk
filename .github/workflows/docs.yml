name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "packages/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "packages/**"
      - ".github/workflows/docs.yml"
  # The Release is created by publish.yml with GITHUB_TOKEN, and GitHub does not
  # trigger workflows for GITHUB_TOKEN-created events, so a `release` trigger here
  # is unreachable. Chain off the publish run instead, which also means docs only
  # ship for a release that actually reached PyPI.
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Deploy docs for this already-released version, e.g. 0.4.0. Empty builds only."
        required: false
        default: ""

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      # Build what deploy will publish, not whatever main happens to be.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install docs tooling and local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material mike "mkdocstrings[python]"
          python -m pip install \
            ./packages/core/agentskills-core \
            ./packages/adapters/agentskills-adapters \
            ./packages/providers/agentskills-fs \
            ./packages/providers/agentskills-http \
            ./packages/integrations/agentskills-langchain \
            ./packages/integrations/agentskills-agentframework \
            ./packages/integrations/agentskills-mcp-server \
            ./packages/retrieval/agentskills-retrieval \
            ./packages/tools/agentskills-tools \
            ./packages/testing/agentskills-testing

      - name: Build site
        run: mkdocs build --strict

  deploy:
    name: Deploy versioned docs
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install docs tooling and local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material mike "mkdocstrings[python]"
          python -m pip install \
            ./packages/core/agentskills-core \
            ./packages/adapters/agentskills-adapters \
            ./packages/providers/agentskills-fs \
            ./packages/providers/agentskills-http \
            ./packages/integrations/agentskills-langchain \
            ./packages/integrations/agentskills-agentframework \
            ./packages/integrations/agentskills-mcp-server \
            ./packages/retrieval/agentskills-retrieval \
            ./packages/tools/agentskills-tools \
            ./packages/testing/agentskills-testing

      - name: Publish docs for release tag
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${TAG#v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::'$VERSION' is not a stable release; not deploying docs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
