name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Surfaces upstream releases that break us even when the repo is quiet.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check packages/ examples/

      - name: Lint
        run: poetry run ruff check packages/ examples/

      # Every package shares one virtualenv here, so a missing declaration is
      # invisible until somebody installs a single package from PyPI.
      - name: Check declared dependencies
        run: poetry run python scripts/check_declared_dependencies.py

      # pip-audit reports on everything in the virtualenv, pip included, so a
      # vulnerability in the pip the venv was seeded with fails the job.
      - name: Upgrade pip in the virtualenv
        run: poetry run python -m pip install --upgrade pip

      - name: Audit dependencies
        run: poetry run pip-audit

  skills:
    name: Validate example skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The action prefers an agentskills already on PATH, so installing
      # this checkout is what points it at the code under review rather
      # than at the last release.
      - name: Install the CLI from this checkout
        run: >-
          python -m pip install
          ./packages/core/agentskills-core
          ./packages/adapters/agentskills-adapters
          ./packages/providers/agentskills-fs
          ./packages/tools/agentskills-tools

      - name: Validate the example skills
        uses: ./actions/validate
        with:
          path: examples/skills
          fail-on-lint: "true"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest packages/ -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install MCP SDK for native extension coverage
        run: poetry run python -m pip install "mcp==2.2.0"

      - name: Check coverage dependency consistency
        run: poetry run python -m pip check

      - name: Run tests with coverage
        run: poetry run python scripts/dev.py test:cov

      - name: Publish coverage to the job summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            poetry run coverage report --fail-under=0 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  test-mcp-modern:
    name: Test (MCP 2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install the modern MCP SDK floor
        run: poetry run python -m pip install "mcp==2.2.0"

      - name: Check dependency consistency
        run: poetry run python -m pip check

      - name: Install the pinned native Skills client
        run: npm install --prefix "$RUNNER_TEMP/mcpc" --no-audit --no-fund --engine-strict @apify/mcpc@0.7.0

      - name: Test native Skills with mcpc
        env:
          AGENTSKILLS_TEST_MCPC: ${{ runner.temp }}/mcpc/node_modules/@apify/mcpc/bin/mcpc
        run: >-
          poetry run pytest
          packages/integrations/agentskills-mcp-server/tests/test_config.py -k mcpc -v

      - name: Run tests
        run: poetry run pytest packages/ -v

      - name: Create an isolated MCP 1.29 client and server environment
        run: |
          python -m venv .mcp-legacy
          .mcp-legacy/bin/python -m pip install "mcp==1.29.0" pytest pytest-asyncio \
            "langchain-mcp-adapters==0.3.2" "agent-framework-core==1.12.1" \
            ./packages/core/agentskills-core \
            ./packages/providers/agentskills-fs \
            ./packages/providers/agentskills-http \
            ./packages/integrations/agentskills-mcp-server
          .mcp-legacy/bin/python -m pip check

      - name: Test MCP 1.29 clients against MCP 2.2 servers
        run: |
          export AGENTSKILLS_TEST_MCP_SERVER_PYTHON="$(poetry env info --executable)"
          export AGENTSKILLS_TEST_NATIVE_MCP_SERVER_PYTHON="$AGENTSKILLS_TEST_MCP_SERVER_PYTHON"
          .mcp-legacy/bin/python -m pytest \
            packages/integrations/agentskills-mcp-server/tests/test_config.py -k stdio -v

      - name: Test MCP 2.2 clients against MCP 1.29 legacy servers
        env:
          AGENTSKILLS_TEST_MCP_SERVER_PYTHON: ${{ github.workspace }}/.mcp-legacy/bin/python
        run: >-
          poetry run pytest
          packages/integrations/agentskills-mcp-server/tests/test_config.py -k stdio -v

      - name: Test framework-owned MCP migration examples
        run: |
          .mcp-legacy/bin/python examples/langchain/fs/mcp_tools.py \
            --smoke --server-python "$(poetry env info --executable)"
          .mcp-legacy/bin/python examples/agent-framework/fs/mcp_tools.py \
            --smoke --server-python "$(poetry env info --executable)"

      - name: Measure synthetic MCP discovery and delivery
        run: poetry run python examples/mcp/benchmark.py --sizes 1 10 100 --repeats 3 > mcp-benchmark.json

      - name: Upload MCP benchmark measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-benchmark
          path: mcp-benchmark.json
          retention-days: 14

  test-unlocked:
    name: Test (latest permitted dependencies)
    runs-on: ubuntu-latest
    # Advisory: an upstream release can break this with no change on our side.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Resolve without the lock file
        run: |
          rm poetry.lock
          poetry install --no-interaction

      - name: Record resolved versions
        run: poetry run pip list

      - name: Run tests
        run: poetry run pytest packages/ -v
