name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Surfaces upstream releases that break us even when the repo is quiet.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check packages/ examples/

      - name: Lint
        run: poetry run ruff check packages/ examples/

      # Every package shares one virtualenv here, so a missing declaration is
      # invisible until somebody installs a single package from PyPI.
      - name: Check declared dependencies
        run: poetry run python scripts/check_declared_dependencies.py

      - name: Audit dependencies
        run: poetry run pip-audit

  skills:
    name: Validate example skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The action prefers an agentskills already on PATH, so installing
      # this checkout is what points it at the code under review rather
      # than at the last release.
      - name: Install the CLI from this checkout
        run: >-
          python -m pip install
          ./packages/core/agentskills-core
          ./packages/adapters/agentskills-adapters
          ./packages/providers/agentskills-fs
          ./packages/cli/agentskills-cli

      - name: Validate the example skills
        uses: ./actions/validate
        with:
          path: examples/skills
          fail-on-lint: "true"

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest packages/ -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests with coverage
        run: poetry run python scripts/dev.py test:cov

      - name: Publish coverage to the job summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            poetry run coverage report --fail-under=0 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  test-unlocked:
    name: Test (latest permitted dependencies)
    runs-on: ubuntu-latest
    # Advisory: an upstream release can break this with no change on our side.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Resolve without the lock file
        run: |
          rm poetry.lock
          poetry install --no-interaction

      - name: Record resolved versions
        run: poetry run pip list

      - name: Run tests
        run: poetry run pytest packages/ -v
