name: Publish

# PyPI Trusted Publishing binds to this workflow's *filename*. Renaming this file
# breaks publishing with an opaque OIDC error, so it does one thing and stays put.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # build-only dry run, publishes nothing

permissions: {}

jobs:
  guard:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ]; then
            echo "Manual run: builds every distribution and publishes nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # An unrecognised tag fails here rather than being routed somewhere
          # harmless. There is no longer a somewhere else to route it to.
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            prerelease=true
          else
            echo "::error::'$REF' is not a release tag. Expected vX.Y.Z, or vX.Y.Z followed by a1, b1 or rc1 for a pre-release."
            exit 1
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "\`$REF\` publishes to **PyPI** (pre-release: $prerelease)." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build distributions
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check versions agree with the tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            python scripts/check_release_version.py --tag "$REF"
          else
            python scripts/check_release_version.py
          fi

      - name: Build
        run: |
          set -euo pipefail
          for pkg in \
            packages/core/agentskills-core \
            packages/providers/agentskills-fs \
            packages/providers/agentskills-http \
            packages/integrations/agentskills-langchain \
            packages/integrations/agentskills-agentframework \
            packages/integrations/agentskills-mcp-server \
            packages/cli/agentskills-cli \
            packages/testing/agentskills-testing
          do
            name="$(basename "$pkg")"
            (cd "$pkg" && poetry build)
            mkdir -p "dist/$name"
            mv "$pkg"/dist/* "dist/$name/"
          done
          find dist -type f | sort

      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [guard, build]
    # A manual run stops at the artifact; releasing takes a tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One job, one step per package: the environment's reviewers approve the
    # release once, not once per package.
    environment:
      name: pypi
    permissions:
      id-token: write # mint the OIDC token; no PyPI token is stored anywhere
    steps:
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: dist
          path: dist

      # core -> providers -> integrations. PyPI does not enforce this order; it
      # exists so nobody can resolve a package whose dependency is not up yet.
      - name: agentskills-core
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agentskills-core
          attestations: true
          skip-existing: true # so a half-finished release can be re-run

      - name: agentskills-fs
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agentskills-fs
          attestations: true
          skip-existing: true

      - name: agentskills-http
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agentskills-http
          attestations: true
          skip-existing: true

      - name: agentskills-langchain
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agentskills-langchain
          attestations: true
          skip-existing: true

      - name: agentskills-agentframework
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agentskills-agentframework
          attestations: true
          skip-existing: true

      - name: agentskills-mcp-server
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agentskills-mcp-server
          attestations: true
          skip-existing: true

      - name: agentskills-cli
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agentskills-cli
          attestations: true
          skip-existing: true

      - name: agentskills-testing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/agentskills-testing
          attestations: true
          skip-existing: true

      - name: Report
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## Publish to PyPI: $OUTCOME"
            echo
            echo "Packages are published in dependency order. If this run failed"
            echo "part-way, the step that failed names the package; everything above"
            echo "it is already live. Re-running is safe — published versions are skipped."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: [guard, publish]
    # Last, so the release notes never advertise a version that failed to publish.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
