site_name: Agent Skills SDK
site_description: Python SDK for discovering, retrieving, and serving Agent Skills
site_url: https://pratikxpanda.github.io/agentskills-sdk/
repo_url: https://github.com/pratikxpanda/agentskills-sdk
repo_name: pratikxpanda/agentskills-sdk

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - MCP Migration: mcp-migration.md
  - MCP Benchmarks: mcp-benchmarks.md
  - Trust and Operability: trust-and-operability.md
  - Packages:
      - Core: packages/core.md
      - Format adapters: packages/adapters.md
      - Filesystem provider: packages/fs.md
      - HTTP provider: packages/http.md
      - MCP server integration: packages/mcp-server.md
      - Skill selection: packages/retrieval.md
      - CLI tooling: packages/tools.md
      - Testing toolkit: packages/testing.md
  - Roadmap: ROADMAP.md
  - ADRs:
      - Overview: adr/README.md
      - 0001 MCP context provider packaging: adr/0001-mcp-context-provider-packaging.md
      - 0002 Optional provider capabilities: adr/0002-optional-provider-capabilities.md
      - 0003 Fully async provider interface: adr/0003-fully-async-provider-interface.md
      - 0004 Lockstep versioning: adr/0004-multi-package-lockstep-versioning.md
      - 0005 Provider caching: adr/0005-provider-caching-and-invalidation.md
      - 0006 Exception taxonomy: adr/0006-exception-taxonomy-not-found-vs-unavailable.md
      - 0007 Binary resource envelope: adr/0007-binary-resource-json-envelope.md
      - 0008 Logging conventions: adr/0008-logging-namespace-and-severity.md
      - 0009 Native image content: adr/0009-native-image-content.md
      - 0010 Native Skills only: adr/0010-native-skills-only.md
      - 0011 Publication trust pipeline: adr/0011-publication-trust-pipeline.md
  - Skills Directory: SKILLS-DIRECTORY.md
  - Issue plans:
      - Overview: issues/README.md
      - v0.6 MCP-First Skills: issues/v0.6.md
      - v0.5 Agent Effectiveness: issues/v0.5.md
      - v0.4 Developer Experience: issues/v0.4.md
      - v0.3 Foundations: issues/v0.3.md
  - Development: DEVELOPMENT.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_signature_annotations: true
            separate_signature: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true

extra:
  version:
    provider: mike
