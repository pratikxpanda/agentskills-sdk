[tool.poetry]
name = "agentskills-testing"
version = "0.4.0"
description = "Conformance suite and test doubles for Agent Skills providers (https://agentskills.io)"
license = "MIT"
authors = ["Pratik Panda"]
readme = "README.md"
homepage = "https://agentskills.io"
repository = "https://github.com/pratikxpanda/agentskills-sdk"
packages = [{include = "agentskills_testing"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
agentskills-core = ">=0.4.0,<1.0"
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
pyyaml = ">=6.0,<7.0"

[tool.poetry.plugins.pytest11]
agentskills_testing = "agentskills_testing.fixtures"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
