[tool.poetry]
name = "agentskills-azure-blob"
version = "0.7.0"
description = "Azure Blob Storage provider for the Agent Skills format (https://agentskills.io)"
license = "MIT"
authors = ["Pratik Panda"]
readme = "README.md"
homepage = "https://agentskills.io"
repository = "https://github.com/pratikxpanda/agentskills-sdk"
packages = [{include = "agentskills_azure_blob"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
agentskills-core = ">=0.7.0,<1.0"
azure-identity = ">=1.19,<2.0"
azure-storage-blob = {version = ">=12.23,<13.0", extras = ["aio"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"