[tool.poetry]
name = "agentskills-mcp-server"
version = "0.7.0"
description = "Serve the official MCP Skills extension with lossless resources (https://agentskills.io)"
license = "MIT"
authors = ["Pratik Panda"]
readme = "README.md"
homepage = "https://agentskills.io"
repository = "https://github.com/pratikxpanda/agentskills-sdk"
packages = [{include = "agentskills_mcp_server"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
agentskills-core = ">=0.7.0,<1.0"
agentskills-fs = {version = ">=0.6.0,<1.0", optional = true}
agentskills-http = {version = ">=0.6.0,<1.0", optional = true}
mcp = ">=2.2,<3"
pydantic = ">=2.0"

[tool.poetry.extras]
fs = ["agentskills-fs"]
http = ["agentskills-http"]

[tool.poetry.scripts]
agentskills-mcp-server = "agentskills_mcp_server.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
